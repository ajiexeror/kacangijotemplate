<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP — Forgot password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Enter your email address and we’ll send you instructions to reset your password.</p>

      <form id="authForgotForm" class="auth-form" action="#" method="post" novalidate>
        <div class="auth-fields-block">
          <div class="auth-field">
            <label class="auth-label" for="forgotEmail">Email</label>
            <input
              type="email"
              id="forgotEmail"
              class="form-control"
              name="email"
              autocomplete="email"
              placeholder="somplak@kacangijo.info"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-primary">Send Reset Instructions</button>
      </form>

      <p class="auth-footer mb-0">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
      document.getElementById("authForgotForm").addEventListener("submit", function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
