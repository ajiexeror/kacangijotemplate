<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP — Create account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1 class="auth-title auth-title--register">Create New Account</h1>

      <form id="authRegisterForm" class="auth-form" action="#" method="post" novalidate>
        <div class="auth-fields-block">
          <div class="auth-field">
            <label class="auth-label" for="regFirstName">First name</label>
            <input
              type="text"
              id="regFirstName"
              class="form-control"
              name="first_name"
              autocomplete="given-name"
              placeholder="First name"
              required
            />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="regLastName">Last name</label>
            <input
              type="text"
              id="regLastName"
              class="form-control"
              name="last_name"
              autocomplete="family-name"
              placeholder="Last name"
              required
            />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="regEmail">Email</label>
            <input
              type="email"
              id="regEmail"
              class="form-control"
              name="email"
              autocomplete="email"
              placeholder="somplak@kacangijo.info"
              required
            />
          </div>

          <div class="auth-field">
            <label class="auth-label" for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              class="form-control"
              name="password"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-primary">Register</button>
      </form>

      <div class="auth-divider" role="presentation">
        <span class="auth-divider-line" aria-hidden="true"></span>
        <span class="auth-divider-text">or continue with</span>
        <span class="auth-divider-line" aria-hidden="true"></span>
      </div>

      <button type="button" class="auth-social-btn" aria-label="Continue with Google">
        <i class="bi bi-google" aria-hidden="true"></i>
        Google
      </button>
      <button type="button" class="auth-social-btn" aria-label="Continue with GitHub">
        <i class="bi bi-github" aria-hidden="true"></i>
        GitHub
      </button>

      <p class="auth-footer mb-0">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
      document.getElementById("authRegisterForm").addEventListener("submit", function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
