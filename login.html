<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/tailwind.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1 class="auth-title">Login</h1>
      <p class="auth-subtitle">Enter your email below to login to your account</p>

      <form id="authLoginForm" class="auth-form" action="#" method="post" novalidate>
        <div class="auth-fields-block">
          <div class="auth-field">
            <label class="auth-label" for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              class="form-control"
              name="email"
              autocomplete="email"
              placeholder="somplak@kacangijo.info"
              required
            />
          </div>

          <div class="auth-field">
            <div class="auth-label-row">
              <label class="auth-label mb-0" for="loginPassword">Password</label>
              <a class="auth-link" href="forgot-password.html">Forgot your password?</a>
            </div>
            <input
              type="password"
              id="loginPassword"
              class="form-control"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-btn-primary">Login</button>
      </form>

      <div class="auth-divider" role="presentation">
        <span class="auth-divider-line" aria-hidden="true"></span>
        <span class="auth-divider-text">or continue with</span>
        <span class="auth-divider-line" aria-hidden="true"></span>
      </div>

      <button type="button" class="auth-social-btn" aria-label="Continue with Google">
        <i class="bi bi-google" aria-hidden="true"></i>
        Google
      </button>
      <button type="button" class="auth-social-btn" aria-label="Continue with GitHub">
        <i class="bi bi-github" aria-hidden="true"></i>
        GitHub
      </button>

      <p class="auth-footer mb-0">
        Don’t have an account?
        <a href="register.html">Sign up</a>
      </p>
    </main>

    <script src="assets/js/auth.js"></script>
    <script>
      document.getElementById("authLoginForm").addEventListener("submit", function (e) {
        e.preventDefault();
      });
    </script>
  </body>
</html>
